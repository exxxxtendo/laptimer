name: LapTimer
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.5"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  LapTimer:
    type: application
    platform: iOS
    sources:
      - path: .
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.laptimer
        PRODUCT_NAME: LapTimer
