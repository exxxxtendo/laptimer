name: LapTimer
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.5"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  LapTimer:
    type: application
    platform: iOS
    sources:
      - LapTimerApp.swift
      - Models
      - Services
      - Views
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        MinimumOSVersion: "15.0"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [gps, arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "Нужно для записи трека и подсчёта времени круга."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Нужно для подсчёта кругов при выключенном экране."
        NSLocationAlwaysUsageDescription: "Нужно для подсчёта кругов при выключенном экране."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.laptimer
        PRODUCT_NAME: LapTimer
